name: Cloudflare env var password tests

on:
  pull_request:
    paths:
      - .github/workflows/cloudflare-env-var-password-tests.yml
      - plugins/cloudflare-env-var-password/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/cloudflare-env-var-password-tests.yml
      - plugins/cloudflare-env-var-password/**
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugins/cloudflare-env-var-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run unit tests
        run: yarn test:junit

      - name: Publish JUnit test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          check_name: JUnit Test Report
          report_paths: plugins/cloudflare-env-var-password/unit-tests.junit.xml
          require_tests: true
