name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            plugins/cloudflare-auto-session/.yarn/cache
            plugins/cloudflare-env-var-password/.yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install cloudflare-auto-session dependencies
        working-directory: plugins/cloudflare-auto-session
        run: yarn install --immutable

      - name: Install cloudflare-env-var-password dependencies
        working-directory: plugins/cloudflare-env-var-password
        run: yarn install --immutable

      - name: Lint cloudflare-auto-session
        working-directory: plugins/cloudflare-auto-session
        run: yarn lint

      - name: Lint cloudflare-env-var-password
        working-directory: plugins/cloudflare-env-var-password
        run: yarn lint

      - name: Run cloudflare-env-var-password unit tests
        if: ${{ !cancelled() }}
        working-directory: plugins/cloudflare-env-var-password
        run: yarn test:junit

      - name: Publish JUnit test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          check_name: JUnit Test Report
          report_paths: plugins/cloudflare-env-var-password/unit-tests.junit.xml
          require_tests: true
